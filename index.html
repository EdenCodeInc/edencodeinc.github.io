
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>EdenCode - Unlock Quantum with AI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/favicon.png" />
      <!-- Apply theme before first paint (default: light) to avoid a flash -->
      <script>
        (function () {
          try {
            if (localStorage.getItem('edencode-theme') !== 'dark') {
              document.documentElement.classList.add('light');
            }
          } catch (e) {
            document.documentElement.classList.add('light');
          }
        })();
      </script>
      <!-- GitHub Pages SPA redirect handler -->
      <script>
        (function() {
          var redirect = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (redirect && redirect !== location.pathname) {
            history.replaceState(null, null, redirect);
          }
          
          // Also check for redirect parameter in URL
          var urlParams = new URLSearchParams(window.location.search);
          var redirectParam = urlParams.get('redirect');
          if (redirectParam) {
            history.replaceState(null, null, redirectParam);
          }
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
